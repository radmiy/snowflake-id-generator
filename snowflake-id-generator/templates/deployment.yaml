apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-deployment
  labels:
    {{- include "id-generator.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/change-cause: "Helm upgrade {{ .Chart.AppVersion }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      name: {{ .Chart.Name }}
      labels:
        app: {{ .Chart.Name }}
    spec:
      initContainers:
        - name: init-worked-id
          image: busybox
          command:
            - sh
            - -c
            - |
              WORKED_ID=$((1 + RANDOM % 31))
              echo $WORKED_ID > /worked-id/worked-id.txt
              echo "Generated worked-id: $WORKED_ID"
          volumeMounts:
            - name: worked-id-volume
              mountPath: /worked-id
      containers:
        - name: snowflake-id-generator
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: LOG_LEVEL
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: MESSAGE
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: SPRING_APPLICATION_NAME
            - name: STARTING_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: STARTING_EPOCH
            - name: WORKED_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: WORKED_ID
            - name: DATACENTER_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Chart.Name }}-config
                  key: DATACENTER_ID
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: SPRING_DATASOURCE_URL_0
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: LIQUIBASE_COMMAND_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: SPRING_DATASOURCE_URL_0
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgres.fullNameOverride }}-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              export WORKED_ID=$(cat /worked-id/worked-id.txt)
              echo "id-generator-settings.worked-id = $WORKED_ID"
              exec java -jar app.jar
          volumeMounts:
            - name: worked-id-volume
              mountPath: /worked-id
            - name: id-generator-config-volume
              mountPath: /config
              readOnly: true
            - name: postgres-config-volume
              mountPath: /postgres_config
              readOnly: true
            - name: postgres-secrets-volume
              mountPath: /postgres_secrets
              readOnly: true
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: {{ .Values.deployment.livenessProbe.httpGet.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.deployment.readinessProbe.httpGet.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      restartPolicy: Always
      volumes:
        - name: worked-id-volume
          emptyDir: { }
        - name: id-generator-config-volume
          configMap:
            name: id-generator-config
        - name: postgres-config-volume
          configMap:
            name: postgres-config
        - name: postgres-secrets-volume
          secret:
            secretName: postgres-secrets
