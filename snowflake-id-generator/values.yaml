replicaCount: 3

image:
  repository: snowflake-id-generator
  tag: 0.0.1-SNAPSHOT
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: contour
  host: snowflake.dev.local
  tls: true

deployment:
  livenessProbe:
    httpGet:
      path: /management/health/liveness
  readinessProbe:
    httpGet:
      path: /management/health/readiness
  initContainers:
    - name: init-worked-id
      image: busybox
      command:
        - sh
        - -c
        - |
          WORKED_ID=$((1 + RANDOM % 31))
          echo $WORKED_ID > /worked-id/worked-id.txt
          echo "Generated worked-id: $WORKED_ID"
      volumeMounts:
        - name: worked-id-volume
          mountPath: /worked-id
config:
  logLevel: "debug"
  message: "Hello, world from ConfigMap!"
  springApplicationName: "Snowflake Id Generator"
  startingEpoch: "946684800"
  dataCenterId: "1"
  workedId: "1"

secrets:
  crt: 
  key: 

global:
  postgres:
    fullNameOverride: "postgres"
    postgresUser: "postgres"
    postgresPassword: "postgres"
    springDataSourceUrl0: "jdbc:postgresql://postgres-0.postgres:5432/app_db"
    springDataSourceUrl1: "jdbc:postgresql://postgres-1.postgres:5432/app_db"
    postgresDb: "app_db"
    postgresPort: "5432"
    postgresDriverClass: "org.postgresql.Driver"

